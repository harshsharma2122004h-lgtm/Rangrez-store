<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rangrej – Handblock Prints, Jaipur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--panel:#ece7dc;--wall:#e8e2d5;--wall2:#f3efe6;--surface:#fdfbf7;--fg:#171512;--mut:#7a746a;--ln:#d9d2c3;--ink:#171512;--inf:#f7f4ee;--ac:#8a5a3c;--serif:'Instrument Serif','Times New Roman',serif;--sans:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--sans);overflow-x:hidden}
img{display:block;max-width:100%}button{font:inherit;color:inherit;cursor:pointer;border-radius:0}a{color:inherit}:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.g{padding-inline:max(16px,env(safe-area-inset-left))}.wrap{max-width:1320px;margin:auto}.caps{font:500 11px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.ann{background:var(--ink);color:var(--inf);text-align:center;padding:9px 12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:22px max(16px,env(safe-area-inset-left))}
.logo{font:500 20px/1 var(--sans);letter-spacing:.42em;text-transform:uppercase;text-decoration:none;padding-left:.42em;color:var(--fg)}.logo b{font-weight:500;color:var(--ac)}
.nv{display:flex;gap:26px}.nv a{text-decoration:none;color:var(--mut);font:500 11px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid transparent;padding:4px 0}.nv a:hover{color:var(--fg);border-color:var(--fg)}
.bag{justify-self:end;background:none;border:0;border-bottom:1px solid transparent;font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:8px 0}.bag:hover{border-color:var(--fg)}
.hero{text-align:center;padding-top:clamp(24px,5vw,60px)}
.hero h1{font:400 clamp(50px,10vw,138px)/.92 var(--serif);letter-spacing:-.03em;margin:20px auto;text-wrap:balance}.hero h1 em{font-style:italic}
.hero .sub{color:var(--mut);max-width:46ch;margin:0 auto;padding-inline:16px}
.stage{margin-top:clamp(28px,5vw,52px);background:linear-gradient(var(--wall) 0%,var(--wall2) 74%,var(--wall) 74.2%,var(--panel) 100%);border-block:1px solid var(--ln)}
.rail{overflow-x:auto;scrollbar-width:none;cursor:grab;touch-action:pan-x pan-y}.rail::-webkit-scrollbar{display:none}.rail.drag{cursor:grabbing;user-select:none}
.track{display:flex;gap:clamp(8px,1.4vw,20px);position:relative;min-width:max-content;padding:34px max(16px,calc((100vw - 1320px)/2 + 16px)) 30px}
.track:before{content:"";position:absolute;left:0;right:0;top:32px;height:6px;background:linear-gradient(#f6f4ef,#8f8d86 45%,#55534d);box-shadow:0 8px 14px #0003}
.item{position:relative;background:none;border:0;padding:0;width:clamp(150px,19vw,230px);text-align:left;flex:none;-webkit-tap-highlight-color:transparent}
.hk{display:block;width:1px;height:26px;margin:0 auto;background:#8a867d}
.pf{display:block;position:relative;transform-origin:50% 0;animation:sway 7s ease-in-out infinite;animation-delay:var(--d,0s)}.pf img{width:100%;aspect-ratio:3/4;object-fit:cover;box-shadow:0 10px 22px #0002;border:5px solid #fffdf8}
.item:hover .pf{animation:none;transform:rotate(-1.6deg);transition:transform .5s}
@keyframes sway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
.tag{position:absolute;top:10px;right:10px;background:#f6f2e8;border:1px solid #cdc7b8;font:600 10px/1 var(--sans);letter-spacing:.06em;padding:5px 7px;transform:rotate(7deg);box-shadow:0 2px 4px #0002;color:#171512}
.iname{display:block;margin-top:12px;font:500 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase}.imeta{display:block;color:var(--mut);font-size:12.5px}
.railbar{display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-left));color:var(--mut);max-width:1320px;margin:auto}
.arrows{display:flex;gap:8px}.arrow{width:42px;height:42px;border:1px solid var(--ln);background:none;font-size:15px}.arrow:hover{border-color:var(--fg)}
.sec{max-width:1320px;margin:auto;padding:clamp(56px,9vw,110px) max(16px,env(safe-area-inset-left)) 0}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
h2{font:400 clamp(36px,5.6vw,66px)/.98 var(--serif);letter-spacing:-.02em}h2 em{font-style:italic}
.tabs{display:flex;gap:26px;flex-wrap:wrap}.tabs button{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;color:var(--mut);font:500 11px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase}.tabs .on,.tabs button:hover{color:var(--fg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 12px}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:40px 18px}}
.card{cursor:pointer;min-width:0}.ph{position:relative;overflow:hidden;background:var(--panel)}.ph img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}.card:hover .ph img{transform:scale(1.05)}
.quick{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--inf);border:0;text-align:center;padding:13px;font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;transform:translateY(101%);transition:transform .3s}.card:hover .quick,.quick:focus-visible{transform:none}@media(hover:none){.quick{transform:none;background:#171512e6}}
.cn{display:block;margin-top:12px;font:500 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase}.cm{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.craft{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));border-top:1px solid var(--fg)}.craft div{padding:28px 28px 0 0}.craft h4{font:400 28px/1.1 var(--serif);margin-bottom:10px}.craft p{color:var(--mut);max-width:34ch}
footer{max-width:1320px;margin:clamp(60px,9vw,110px) auto 0;display:grid;grid-template-columns:2fr repeat(3,1fr);gap:32px;padding:56px max(16px,env(safe-area-inset-left)) 20px;border-top:1px solid var(--ln)}
footer h5{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}footer a{display:block;text-decoration:none;color:var(--mut);font-size:14px;margin:8px 0}footer a:hover{color:var(--fg)}footer .fl{font:500 18px/1 var(--sans);letter-spacing:.42em;text-transform:uppercase;margin-bottom:12px;color:var(--fg)}footer p{color:var(--mut);max-width:32ch;font-size:14px}
.legal{max-width:1320px;margin:auto;padding:18px max(16px,env(safe-area-inset-left)) 28px;border-top:1px solid var(--ln);color:var(--mut);font-size:12.5px}
@media(max-width:760px){header{grid-template-columns:1fr auto;grid-template-areas:"l b" "n n";row-gap:14px}.logo{grid-area:l;font-size:16px;letter-spacing:.34em;padding:0}.bag{grid-area:b}.nv{grid-area:n;justify-content:center;gap:22px;border-top:1px solid var(--ln);padding-top:12px}footer{grid-template-columns:1fr 1fr}footer>div:first-child{grid-column:1/-1}}
.ov{position:fixed;inset:0;background:#171512a6;z-index:50;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sh{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:26px;position:relative}@media(min-width:700px){.ov{align-items:center}}
.sh h3{font:400 34px/1.05 var(--serif);letter-spacing:-.01em;margin-bottom:8px}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border:1px solid var(--ln);background:var(--surface);font-size:20px;line-height:1;z-index:3}.x:hover{border-color:var(--fg)}
.ov.dr{justify-content:flex-end;align-items:stretch}.ov.dr .sh{max-width:440px;height:100%;max-height:none}
.sh.pv{max-width:1000px;padding:0;display:grid}@media(min-width:760px){.sh.pv{grid-template-columns:1.1fr 1fr;max-height:min(680px,92vh)}}
.pim{background:linear-gradient(170deg,var(--wall2),var(--panel));min-height:0}.pim img{width:100%;height:100%;max-height:70vh;object-fit:cover}@media(min-width:760px){.pim img{max-height:none;min-height:100%}}
.pin{padding:clamp(22px,3.2vw,44px);display:flex;flex-direction:column;gap:16px;overflow:auto}.pin h3{font-size:clamp(34px,4vw,48px)}
.pr{font:500 17px var(--sans);color:var(--fg)}.mut{color:var(--mut);font-size:13px}.desc{color:var(--mut)}
.dets{margin-top:auto;border-top:1px solid var(--ln);padding-top:14px;color:var(--mut);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{width:100%;padding:16px 28px;border:1px solid var(--ink);background:var(--ink);color:var(--inf);font:500 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-top:10px;display:flex;justify-content:center;text-decoration:none}.btn:hover{background:transparent;color:var(--fg)}.btn.o{background:none;color:var(--fg)}.btn.o:hover{background:var(--ink);color:var(--inf)}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:13px;margin:4px 0 12px;border:1px solid var(--ln);border-radius:0;background:var(--bg);color:var(--fg);font:inherit}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fg)}
label{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.li{display:flex;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--ln)}.li img{width:72px;height:90px;object-fit:cover}.li>span{flex:1;font-size:14px}
.q{display:inline-flex;align-items:center;border:1px solid var(--ln)}.q button{width:32px;height:32px;border:0;background:none}.q button:hover{background:var(--panel)}
.ad .c{border:1px solid var(--ln);padding:14px;margin:14px 0;background:var(--surface)}.ad img{height:80px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="ann">Handblock prints · Jaipur · Cash on Delivery · UPI</div>
<header><div class="nv"><a href="#col">Collection</a><a href="contact.html">Contact</a></div><a class="logo" href="#">RANG<b>REJ</b></a><button class="bag" onclick="B(1)">Bag (<span id="cc">0</span>)</button></header>
<main id="m"></main>
<footer><div><div class="fl">RANG<b style="font-weight:500;color:var(--ac)">REJ</b></div><p>Jaipur ke karigaron ke haath se chhape handblock kurtis, jackets aur fabrics.</p></div><div><h5>Shop</h5><a href="#col">Collection</a></div><div><h5>Help</h5><a href="shipping-policy.html">Shipping</a><a href="refund-policy.html">Refund</a><a href="contact.html">Contact</a></div><div><h5>Legal</h5><a href="privacy-policy.html">Privacy</a><a href="terms.html">Terms</a></div></footer><div class="legal">© Rangrej · Jaipur, Rajasthan</div>
<div class="ov" id="ov" onclick="if(event.target==this)C()"><div class="sh" id="sh"></div></div>
<script>
const KEY='f750d455-bdcc-4e8a-91fd-2d67c61295e7',WA='917742057696',UPI='7742057696@ibl';
let P=[],cart=[],cat='All';try{cart=JSON.parse(localStorage.getItem('rc2')||'[]')}catch(e){}
const $=s=>document.querySelector(s),R=n=>'₹'+n.toLocaleString('en-IN'),sv=()=>{try{localStorage.setItem('rc2',JSON.stringify(cart))}catch(e){}};
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('products.json?'+Date.now()).then(r=>r.json()).then(j=>{P=j;route()}).catch(()=>{$('#m').innerHTML='<p style="padding:30px">Products load nahi hue.</p>'});
function route(){if(location.hash=='#admin')return admin();shop();bagc()}
function setCat(c){cat=c;shop();document.getElementById('col').scrollIntoView()}
function shop(){const cs=['All',...new Set(P.map(p=>p.c))];
$('#m').innerHTML=`<section class="hero"><div class="caps" style="color:var(--mut)">Jaipur · Handblock prints</div><h1>Prints that<br><em>hang</em> beautifully.</h1><p class="sub">Rail ko sarkayein, kisi bhi piece par tap karein aur detail dekhkar bag mein daalein.</p>
<div class="stage"><div class="rail" id="rail" tabindex="0" aria-label="Product rail"><div class="track">${P.map((p,i)=>`<button class="item" data-id="${p.id}" style="--d:-${(i*1.3)%7}s"><i class="hk"></i><span class="pf"><img loading="lazy" src="${E(p.img)}" alt=""><em class="tag">${R(p.p)}</em></span><span class="iname">${E(p.n)}</span><span class="imeta">${E(p.c)}</span></button>`).join('')}</div></div></div>
<div class="railbar"><span class="caps">Drag ya swipe karein</span><div class="arrows"><button class="arrow" onclick="rs(-1)" aria-label="Pichla">←</button><button class="arrow" onclick="rs(1)" aria-label="Agla">→</button></div></div></section>
<section class="sec" id="col"><div class="shead"><h2>The <em>edit</em></h2><div class="tabs">${cs.map(c=>`<button class="${c==cat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div></div><div class="grid">${P.filter(p=>cat=='All'||p.c==cat).map(p=>`<div class="card" onclick="V(${p.id})"><div class="ph"><img loading="lazy" src="${E(p.img)}" alt=""><button class="quick" onclick="event.stopPropagation();A(${p.id})">+ Bag mein daalein</button></div><span class="cn">${E(p.n)}</span><span class="cm">${R(p.p)} ${E(p.unit)}</span></div>`).join('')}</div></section>
<section class="sec"><div class="craft"><div><h4>Jaipur ke karigar</h4><p>Bagru se Kalamkari tak, har piece handblock print.</p></div><div><h4>Aasan ordering</h4><p>Cash on Delivery ya UPI, aur order seedha WhatsApp par.</p></div><div><h4>Tracking</h4><p>Aapke order ki tracking WhatsApp ya email par bheji jaati hai.</p></div></div></section>`;rl()}
function rs(d){const r=$('#rail');r.scrollBy({left:d*Math.max(260,r.clientWidth*.6),behavior:'smooth'})}
function rl(){const r=$('#rail');if(!r)return;let d=0,x=0,s=0,m=0;
r.onpointerdown=e=>{if(e.pointerType!='mouse')return;d=1;m=0;x=e.clientX;s=r.scrollLeft};
r.onpointermove=e=>{if(!d)return;const k=e.clientX-x;if(Math.abs(k)>5){m=1;r.classList.add('drag')}r.scrollLeft=s-k};
r.onpointerup=r.onpointerleave=()=>{d=0;r.classList.remove('drag')};
r.onclick=e=>{const i=e.target.closest('.item');if(i&&!m)V(i.dataset.id);m=0}}
function O(h,c){c=c||(h.indexOf('<h3>Aapka Bag')==0?'dr':'');$('#sh').className='sh '+c;$('#ov').className='ov on '+c;$('#sh').innerHTML='<button class="x" onclick="C()">×</button>'+h}function C(){$('#ov').classList.remove('on')}
function V(id){const p=P.find(x=>x.id==id);O(`<div class="pim"><img src="${E(p.img)}" alt=""></div><div class="pin"><span class="caps mut">${E(p.c)}</span><h3>${E(p.n)}</h3><div class="pr">${R(p.p)} <small class="mut">${E(p.unit)}</small></div><p class="desc">${E(p.d)}</p><button class="btn" onclick="A(${p.id})">Bag mein daalein</button><div class="dets"><span>SKU: ${E(p.sku)}</span><span>COD · UPI</span></div></div>`,'pv')}
function A(id){const x=cart.find(c=>c.id==id);x?x.q++:cart.push({id,q:1});sv();bagc();B(1)}
function bagc(){cart=cart.filter(c=>P.find(p=>p.id==c.id));$('#cc').textContent=cart.reduce((s,c)=>s+c.q,0)}
const tot=()=>cart.reduce((s,c)=>s+c.q*P.find(p=>p.id==c.id).p,0);
function B(o){if(!o)return;bagc();O('<h3>Aapka Bag</h3>'+(cart.length?cart.map(c=>{const p=P.find(x=>x.id==c.id);return `<div class="li"><img src="${E(p.img)}" alt=""><span>${E(p.n)}<br><b>${R(p.p)}</b> ${E(p.unit)}</span><div class="q"><button onclick="Q(${c.id},-1)">−</button>${c.q}<button onclick="Q(${c.id},1)">+</button></div></div>`}).join('')+`<p class="pr" style="margin:12px 0">Total: ${R(tot())}</p><button class="btn" onclick="K()">Order karein</button>`:'<p class="mut">Bag khali hai.</p>'))}
function Q(id,d){const c=cart.find(x=>x.id==id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x!==c);sv();B(1)}
function K(){O(`<h3>Delivery details</h3><label>Naam</label><input id="fn"><label>Mobile</label><input id="fp" type="tel"><label>Pura address</label><textarea id="fa" rows="3"></textarea><label>Pincode</label><input id="fz" inputmode="numeric"><label>Payment</label><select id="fm"><option value="COD">Cash on Delivery</option><option value="UPI">UPI (abhi pay karein)</option></select><p class="pr">Total: ${R(tot())}</p><button class="btn" id="ob" onclick="S()">Order confirm karein</button><p class="mut" id="er"></p>`)}
async function S(){const g=i=>$('#'+i).value.trim(),n=g('fn'),ph=g('fp'),ad=g('fa'),pz=g('fz'),pm=g('fm');
if(!n||ph.replace(/\D/g,'').length<10||!ad||pz.length<6){$('#er').textContent='Naam, 10 digit mobile, address aur pincode bharein.';return}
const id='RNG'+Date.now().toString(36).toUpperCase(),T=tot(),L=cart.map(c=>{const p=P.find(x=>x.id==c.id);return `${p.sku} | ${p.n} x ${c.q} ${p.unit} = ${R(p.p*c.q)}`}).join('\n');
const msg=`Order ID: ${id}\nNaam: ${n}\nMobile: ${ph}\nAddress: ${ad}\nPincode: ${pz}\nPayment: ${pm}\n\n${L}\n\nTotal: ${R(T)}`;
$('#ob').disabled=true;$('#ob').textContent='Bhej rahe hain...';let ok=false;
try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:KEY,subject:'Naya Rangrej order '+id,from_name:'Rangrej Store',message:msg})});ok=(await r.json()).success}catch(e){}
cart=[];sv();bagc();
const wa='https://wa.me/'+WA+'?text='+encodeURIComponent(msg),up=`upi://pay?pa=${UPI}&pn=Rangrej&am=${T}&cu=INR&tn=${id}`;
O(`<h3>${ok?'Order mil gaya ✅':'Almost done'}</h3><p>Order ID: <b>${id}</b></p>${ok?'':'<p class="mut">Email nahi gaya, isliye neeche WhatsApp se order bhejna zaroori hai.</p>'}${pm=='UPI'?`<a class="btn" href="${up}">UPI se ₹${T} pay karein</a><p class="mut">Pay karke screenshot WhatsApp par bhej dein.</p>`:''}<a class="btn o" href="${wa}">WhatsApp par order bhejein</a><p class="mut" style="margin-top:10px">Tracking aapko WhatsApp par bhej di jayegi.</p>`)}
/* ---------- ADMIN (#admin) : GitHub token = password ---------- */
let D=[],cf={};try{cf=JSON.parse(localStorage.getItem('rg')||'{}')}catch(e){}
const gh=(p,o={})=>fetch(`https://api.github.com/repos/${cf.repo}/contents/${p}`+(o.method=='PUT'?'':'?ref='+cf.br),{...o,headers:{Authorization:'Bearer '+cf.t,Accept:'application/vnd.github+json'}});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function put(p,c,sha){const g=await gh(p);const j=g.ok?await g.json():{};const r=await gh(p,{method:'PUT',body:JSON.stringify({message:'Admin update '+p,content:c,branch:cf.br,sha:j.sha})});if(!r.ok)throw new Error(p+': '+r.status)}
function admin(){bagc();if(!cf.t){$('#m').innerHTML=`<div class="ad" style="padding:20px;max-width:480px;margin:auto"><h2>Admin login</h2><p class="mut">GitHub repo (jaise harsh/Rangrez-store), branch, aur token.</p><label>Repo</label><input id="ar"><label>Branch</label><input id="ab" value="main"><label>Token</label><input id="at" type="password"><button class="btn" onclick="adl()">Login</button><p id="am" class="mut"></p></div>`;return}
if(!D.length)D=JSON.parse(JSON.stringify(P));
const f=(i,k,l,t)=>`<label>${l}</label><input ${t?'type="number"':''} data-i="${i}" data-k="${k}" value="${E(D[i][k])}">`;
